<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Barter №52</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #ffffff;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 15px;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: .9;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    main {
      max-width: 850px;
      margin: 20px auto;
      padding: 0 15px;
    }

    section {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin: 7px 0 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }

    .hidden {
      display: none !important;
    }

    .auth-box {
      max-width: 430px;
      margin: 60px auto;
      text-align: center;
    }

    .auth-box img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
      background: #eee;
    }

    .switch-auth {
      margin-top: 15px;
      color: #555;
      cursor: pointer;
    }

    .listing {
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 16px;
      margin: 12px 0;
    }

    .listing h3 {
      margin-top: 0;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin: 10px 0;
    }

    .info {
      margin-top: 8px;
      color: #555;
    }

    .contact {
      margin-top: 12px;
      padding: 10px;
      background: #f4f4f4;
      border-radius: 10px;
    }

    .buy-button {
      width: 100%;
      margin-top: 14px;
      background: #16803c;
    }

    .danger {
      background: #b42318;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      background: #eee;
      display: block;
      margin-bottom: 15px;
    }

    .top-user {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-user img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 12px;
      }

      .header-buttons {
        width: 100%;
      }

      .header-buttons button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- АВТОРИЗАЦИЯ -->
  <div id="authScreen">

    <section class="auth-box">

      <h1 id="authTitle">🏫 School Barter №52</h1>

      <p id="authSubtitle">
        Зарегистрируйся, чтобы пользоваться сайтом
      </p>

      <div id="registerFields">

        <label>Имя</label>
        <input id="regName" type="text" placeholder="Твоё имя">

        <label>Класс</label>
        <input id="regClass" type="text" placeholder="Например: 7А">

        <label>Корпус</label>
        <select id="regBuilding">
          <option value="">Выбери корпус</option>
          <option value="Старый корпус">Старый корпус</option>
          <option value="Новый корпус">Новый корпус</option>
        </select>

        <label>Аватарка</label>
        <input id="regAvatar" type="file" accept="image/*">

      </div>

      <label>Email</label>
      <input id="authEmail" type="email" placeholder="example@mail.ru">

      <label>Пароль</label>
      <input id="authPassword" type="password" placeholder="Минимум 6 символов">

      <button id="authButton" onclick="register()">
        Зарегистрироваться
      </button>

      <div class="switch-auth" onclick="toggleAuthMode()">
        Уже есть аккаунт? Войти
      </div>

    </section>

  </div>

  <!-- ОСНОВНОЙ САЙТ -->
  <div id="siteScreen" class="hidden">

    <header>

      <div class="top-user">
        <img id="headerAvatar" src="">
        <h1>🏫 School Barter №52</h1>
      </div>

      <div class="header-buttons">
        <button onclick="showProfile()">👤 Профиль</button>
        <button onclick="showMenu()">☰ Меню</button>
        <button onclick="showPublish()">➕ Разместить</button>
      </div>

    </header>

    <main>

      <!-- ОБЪЯВЛЕНИЯ -->
      <section id="announcements">

        <h2>📦 Объявления</h2>

        <button onclick="loadItems()">
          🔄 Обновить
        </button>

        <div id="output">
          ⏳ Загружаем...
        </div>

      </section>

      <!-- ПРОФИЛЬ -->
      <section id="profile" class="hidden">

        <h2>👤 Профиль</h2>

        <img id="profileAvatar" class="profile-avatar" src="">

        <label>Имя</label>
        <input id="profileName">

        <label>Класс</label>
        <input id="profileClass">

        <label>Корпус</label>
        <select id="profileBuilding">
          <option value="">Выбери корпус</option>
          <option value="Старый корпус">Старый корпус</option>
          <option value="Новый корпус">Новый корпус</option>
        </select>

        <label>Новая аватарка</label>
        <input id="profileAvatarFile" type="file" accept="image/*">

        <button onclick="saveProfile()">
          💾 Сохранить профиль
        </button>

        <button class="danger" onclick="logout()">
          🚪 Выйти
        </button>

      </section>

      <!-- МЕНЮ -->
      <section id="menu" class="hidden">

        <h2>☰ Меню</h2>

        <button onclick="showSection('announcements')">
          📦 Объявления
        </button>

        <button onclick="showProfile()">
          👤 Профиль
        </button>

        <button onclick="showPublish()">
          ➕ Разместить объявление
        </button>

      </section>

      <!-- РАЗМЕЩЕНИЕ -->
      <section id="publish" class="hidden">

        <h2>➕ Новое объявление</h2>

        <label>Название товара</label>
        <input id="title" placeholder="Например: Учебник по математике">

        <label>Описание</label>
        <textarea id="description" placeholder="Опиши товар"></textarea>

        <label>Тип товара</label>
        <select id="type">
          <option value="">Выбери тип</option>
          <option value="Учебники">Учебники</option>
          <option value="Канцелярия">Канцелярия</option>
          <option value="Одежда">Одежда</option>
          <option value="Игры">Игры</option>
          <option value="Электроника">Электроника</option>
          <option value="Другое">Другое</option>
        </select>

        <label>Цена</label>
        <select id="priceType" onchange="togglePrice()">
          <option value="fixed">Фиксированная</option>
          <option value="range">Диапазон</option>
          <option value="free">Бесплатно</option>
        </select>

        <div id="priceFixedWrap">
          <label>Цена, ₽</label>
          <input id="priceFixed" type="number" min="0">
        </div>

        <div id="priceRangeWrap" class="hidden">

          <label>От, ₽</label>
          <input id="priceMin" type="number" min="0">

          <label>До, ₽</label>
          <input id="priceMax" type="number" min="0">

        </div>

        <label>Класс</label>
        <input id="className" placeholder="Например: 7А">

        <label>Корпус</label>
        <select id="building">
          <option value="">Не указан</option>
          <option value="Старый корпус">Старый корпус</option>
          <option value="Новый корпус">Новый корпус</option>
        </select>

        <label>Этаж</label>
        <input id="floor" placeholder="Например: 2">

        <label>Контакт</label>
        <select id="contactType">
          <option value="Telegram">Telegram</option>
          <option value="Телефон">Телефон</option>
        </select>

        <input id="contact" placeholder="@username или номер телефона">

        <label>Оплата</label>
        <input
          id="payment"
          placeholder="Например: наличными при встрече"
        >

        <button
          style="width:100%; margin-top:10px;"
          onclick="addItem()"
        >
          🚀 Разместить
        </button>

      </section>

    </main>

  </div>

  <script src="app.js"></script>

</body>
</html>
