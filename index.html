<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Барахолка 52</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;padding:15px;background:#f0f2f5}
.header{background:#007bff;color:#fff;padding:15px;border-radius:10px;margin-bottom:20px;text-align:center}
.item{background:#fff;padding:15px;margin:10px 0;border-radius:10px}
.btn{padding:12px;font-size:16px;background:#007bff;color:#fff;border:none;border-radius:8px;width:100%;margin:5px 0;cursor:pointer}
.btn-danger{background:#dc3545}
.form{background:#fff;padding:20px;border-radius:10px;margin:15px 0}
.form input,.form textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:5px}
#output{margin-top:15px}
</style>
</head>
<body>
<div class="header"><h1>🏫 Барахолка 52</h1><p>Общая доска школы</p></div>
<div class="form">
<h3>➕ Добавить</h3>
<input type="text" id="title" placeholder="Название">
<input type="text" id="price" placeholder="Цена">
<textarea id="desc" placeholder="Описание" rows="2"></textarea>
<button class="btn" onclick="addItem()">Опубликовать</button>
</div>
<button class="btn" onclick="loadItems()">Обновить</button>
<div id="output"></div>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const supabase = window.supabase.createClient('https://psyqffckpcajzdzkcboh.supabase.co','sb_publishable_Npm2bjIqxtACscbdjxHbFA_NCqknFxv');
async function loadItems(){
const out=document.getElementById('output');
out.innerHTML='⏳ Загрузка...';
const{data,error}=await supabase.from('объявления').select('*').order('created_at',{ascending:false});
if(error){out.innerHTML='❌ '+error.message;return}
if(!data||data.length===0){out.innerHTML='📭 Пусто';return}
let html='✅ '+data.length+'<br>';
data.forEach(item=>{
html+=`<div class="item"><b>${item.title}</b> — ${item.price||'?'}₽<br>${item.description||''}<br><small>${new Date(item.created_at).toLocaleString()}</small><br><button class="btn btn-danger" onclick="deleteItem('${item.id}')">Удалить</button></div>`;
});
out.innerHTML=html;
}
async function addItem(){
const title=document.getElementById('title').value.trim();
const price=document.getElementById('price').value.trim();
const description=document.getElementById('desc').value.trim();
if(!title){alert('Название обязательно!');return}
const{error}=await supabase.from('объявления').insert([{title,price,description}]);
if(error){alert('❌ '+error.message)}else{alert('✅ Добавлено!');document.getElementById('title').value='';document.getElementById('price').value='';document.getElementById('desc').value='';loadItems()}
}
async function deleteItem(id){
if(!confirm('Удалить?'))return;
await supabase.from('объявления').delete().eq('id',id);
loadItems();
}
loadItems();
</script>
</body>
</html>
