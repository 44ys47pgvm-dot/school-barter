<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Барахолка №52</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: white;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 15px;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: .9;
    }

    main {
      max-width: 850px;
      margin: 20px auto;
      padding: 0 15px;
    }

    section {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin: 7px 0 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 8px;
    }

    .hidden {
      display: none !important;
    }

    .auth-box {
      max-width: 430px;
      margin: 50px auto;
      text-align: center;
    }

    .auth-box button {
      width: 100%;
      margin-top: 5px;
    }

    .switch-auth {
      margin-top: 18px;
      color: #555;
      cursor: pointer;
    }

    .listing {
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 16px;
      margin: 12px 0;
    }

    .listing h3 {
      margin-top: 0;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin: 10px 0;
    }

    .info {
      margin-top: 8px;
      color: #555;
    }

    .contact {
      margin-top: 12px;
      padding: 10px;
      background: #f4f4f4;
      border-radius: 10px;
    }

    .buy-button {
      width: 100%;
      margin-top: 14px;
      background: #16803c;
    }

    .danger {
      background: #b42318;
      margin-top: 10px;
    }

    @media (max-width: 650px) {
      header {
        flex-direction: column;
      }

      .header-buttons {
        width: 100%;
      }

      .header-buttons button {
        flex: 1;
        padding: 10px 7px;
      }
    }
  </style>
</head>

<body>

  <!-- РЕГИСТРАЦИЯ / ВХОД -->

  <div id="authScreen">

    <section class="auth-box">

      <h1 id="authTitle">Барахолка №52</h1>

      <p id="authSubtitle">
        Зарегистрируйся, чтобы пользоваться сайтом
      </p>

      <div id="registerFields">

        <label>Имя</label>

        <input
          id="regName"
          type="text"
          placeholder="Твоё имя"
        >

      </div>

      <label>Email</label>

      <input
        id="authEmail"
        type="email"
        placeholder="example@mail.ru"
      >

      <label>Пароль</label>

      <input
        id="authPassword"
        type="password"
        placeholder="Минимум 6 символов"
      >

      <button
        id="authButton"
        onclick="handleAuth()"
      >
        Зарегистрироваться
      </button>

      <div
        class="switch-auth"
        onclick="toggleAuthMode()"
        id="switchAuthText"
      >
        Уже есть аккаунт? Войти
      </div>

    </section>

  </div>


  <!-- ОСНОВНОЙ САЙТ -->

  <div id="siteScreen" class="hidden">

    <header>

      <h1>🛍️ Барахолка №52</h1>

      <div class="header-buttons">

        <button onclick="showProfile()">
          👤 Профиль
        </button>

        <button onclick="showMenu()">
          ☰ Меню
        </button>

        <button onclick="showPublish()">
          ➕ Разместить
        </button>

      </div>

    </header>


    <main>

      <!-- ОБЪЯВЛЕНИЯ -->

      <section id="announcements">

        <h2>📦 Объявления</h2>

        <button onclick="loadItems()">
          🔄 Обновить
        </button>

        <div id="output">
          ⏳ Загружаем объявления...
        </div>

      </section>


      <!-- ПРОФИЛЬ -->

      <section
        id="profile"
        class="hidden"
      >

        <h2>👤 Мой профиль</h2>

        <label>Имя</label>

        <input
          id="profileName"
          type="text"
        >

        <button onclick="saveProfile()">
          💾 Сохранить
        </button>

        <button
          class="danger"
          onclick="logout()"
        >
          🚪 Выйти
        </button>

      </section>


      <!-- МЕНЮ -->

      <section
        id="menu"
        class="hidden"
      >

        <h2>☰ Меню</h2>

        <button onclick="showSection('announcements')">
          📦 Объявления
        </button>

        <button onclick="showProfile()">
          👤 Профиль
        </button>

        <button onclick="showPublish()">
          ➕ Разместить объявление
        </button>

      </section>


      <!-- РАЗМЕЩЕНИЕ -->

      <section
        id="publish"
        class="hidden"
      >

        <h2>➕ Новое объявление</h2>

        <label>Название товара</label>

        <input
          id="title"
          type="text"
          placeholder="Например: Учебник по математике"
        >

        <label>Описание</label>

        <textarea
          id="description"
          placeholder="Опиши товар"
        ></textarea>

        <label>Тип товара</label>

        <select id="type">

          <option value="">
            Выбери тип
          </option>

          <option value="Учебники">
            Учебники
          </option>

          <option value="Канцелярия">
            Канцелярия
          </option>

          <option value="Одежда">
            Одежда
          </option>

          <option value="Игры">
            Игры
          </option>

          <option value="Электроника">
            Электроника
          </option>

          <option value="Другое">
            Другое
          </option>

        </select>


        <label>Цена</label>

        <select
          id="priceType"
          onchange="togglePrice()"
        >

          <option value="fixed">
            Фиксированная
          </option>

          <option value="range">
            Диапазон
          </option>

          <option value="free">
            Бесплатно
          </option>

        </select>


        <div id="priceFixedWrap">

          <label>Цена, ₽</label>

          <input
            id="priceFixed"
            type="number"
            min="0"
          >

        </div>


        <div
          id="priceRangeWrap"
          class="hidden"
        >

          <label>От, ₽</label>

          <input
            id="priceMin"
            type="number"
            min="0"
          >

          <label>До, ₽</label>

          <input
            id="priceMax"
            type="number"
            min="0"
          >

        </div>


        <label>Контакт</label>

        <select id="contactType">

          <option value="Telegram">
            Telegram
          </option>

          <option value="Телефон">
            Телефон
          </option>

        </select>

        <input
          id="contact"
          type="text"
          placeholder="@username или номер телефона"
        >


        <label>Оплата</label>

        <input
          id="payment"
          type="text"
          placeholder="Например: наличными при встрече"
        >


        <button
          style="width:100%; margin-top:10px;"
          onclick="addItem()"
        >
          🚀 Разместить
        </button>

      </section>

    </main>

  </div>


  <script src="app.js"></script>

</body>
</html>
