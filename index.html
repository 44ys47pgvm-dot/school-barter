<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Барахолка №52</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f7f8fc;
      color: #202124;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;

      background: rgba(255,255,255,.92);
      backdrop-filter: blur(15px);

      border-bottom: 1px solid #eceef4;

      padding: 14px 18px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
      white-space: nowrap;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(135deg, #6c63ff, #9b8cff);
      color: white;
      font-size: 22px;

      box-shadow: 0 8px 20px #6c63ff30;
    }

    nav {
      display: flex;
      gap: 7px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 11px 14px;

      background: #202124;
      color: white;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: .92;
    }

    .hero {
      margin-bottom: 22px;

      border-radius: 28px;
      padding: 32px 25px;

      background:
        radial-gradient(circle at 90% 20%, #bdb5ff55, transparent 35%),
        linear-gradient(135deg, #eeeaff, #ffffff);

      overflow: hidden;
      position: relative;
    }

    .hero h2 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .hero p {
      max-width: 600px;
      color: #626570;
      font-size: 17px;
      line-height: 1.5;
    }

    .hero-art {
      position: absolute;
      right: 25px;
      bottom: -10px;

      font-size: 90px;
      transform: rotate(-7deg);
    }

    main {
      max-width: 950px;
      margin: auto;
      padding: 22px 15px 60px;
    }

    .section {
      background: white;
      border-radius: 24px;
      padding: 21px;
      margin-bottom: 20px;

      box-shadow: 0 5px 25px #00000008;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .section-title h2 {
      margin: 0;
    }

    .listing {
      margin-top: 15px;
      padding: 18px;

      border: 1px solid #eceef3;
      border-radius: 20px;

      background: #fff;

      transition: .2s;
    }

    .listing:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px #0000000b;
    }

    .type {
      display: inline-block;

      padding: 7px 10px;
      border-radius: 999px;

      background: #f0efff;
      color: #5d54d9;

      font-size: 12px;
      font-weight: 700;
    }

    .listing h3 {
      margin: 11px 0 7px;
      font-size: 21px;
    }

    .listing p {
      color: #626570;
      line-height: 1.45;
    }

    .price {
      margin: 13px 0;

      font-size: 21px;
      font-weight: 800;
    }

    .contact {
      margin-top: 13px;
      padding: 12px;

      border-radius: 13px;
      background: #f7f7fa;

      color: #555864;
    }

    .buy {
      width: 100%;
      margin-top: 14px;

      background: linear-gradient(135deg, #16a05d, #20b96e);
    }

    input,
    textarea,
    select {
      width: 100%;

      border: 1px solid #e0e2e8;
      border-radius: 13px;

      padding: 13px;
      margin: 6px 0 14px;

      background: #fafbfc;

      font: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #776cff;
      box-shadow: 0 0 0 3px #776cff18;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    label {
      display: block;
      margin-top: 7px;
      font-weight: 700;
      font-size: 14px;
    }

    .primary {
      width: 100%;

      background: linear-gradient(135deg, #6c63ff, #887fff);

      padding: 14px;
      font-size: 15px;
    }

    .empty {
      padding: 45px 15px;
      text-align: center;
      color: #777b86;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 8px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;

      background: #15151a77;
      backdrop-filter: blur(5px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 18px;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;

      background: white;
      border-radius: 25px;
      padding: 23px;

      box-shadow: 0 20px 70px #00000025;

      animation: popup .2s ease;
    }

    @keyframes popup {
      from {
        transform: scale(.96);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .close {
      width: 100%;
      margin-top: 9px;

      background: #eeeeF2;
      color: #303136;
    }

    .auth-link {
      margin: 15px 0;

      text-align: center;
      color: #665ce6;

      cursor: pointer;
      font-weight: 600;
    }

    .profile-email {
      display: none;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }

      .logo {
        justify-content: center;
      }

      nav {
        width: 100%;
      }

      nav button {
        flex: 1;
        padding: 10px 5px;
        font-size: 12px;
      }

      .hero {
        padding: 25px 20px;
      }

      .hero h2 {
        font-size: 28px;
      }

      .hero-art {
        opacity: .25;
        font-size: 75px;
      }

      main {
        padding-top: 15px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    <div class="logo-icon">🛍️</div>
    <span>Барахолка №52</span>
  </div>

  <nav>
    <button onclick="showSection('home')">
      🏠 Главная
    </button>

    <button onclick="showProfile()">
      👤 Профиль
    </button>

    <button onclick="requestPublish()">
      ➕ Разместить
    </button>
  </nav>

</header>

<main>

  <section id="home" class="hero">

    <div class="hero-art">
      📚🎮🎧
    </div>

    <h2>
      Вещи находят новых хозяев 💜
    </h2>

    <p>
      Покупай, продавай, отдавай и обменивайся
      школьными вещами вместе с учениками №52.
    </p>

  </section>


  <section id="announcements" class="section">

    <div class="section-title">

      <h2>
        📦 Объявления
      </h2>

      <button onclick="loadItems()">
        🔄
      </button>

    </div>

    <div id="output">

      <div class="empty">
        <div class="empty-icon">⏳</div>
        Загружаем объявления...
      </div>

    </div>

  </section>


  <section id="profile" class="section hidden">

    <h2>👤 Профиль</h2>

    <div id="profileNotLogged">

      <p>
        Войди, чтобы настроить свой профиль.
      </p>

      <button onclick="openAuth('login')">
        🔐 Войти
      </button>

    </div>

    <div id="profileLogged" class="hidden">

      <label>
        Твой ник
      </label>

      <input
        id="profileName"
        type="text"
        placeholder="Например: Max52"
      >

      <button onclick="saveProfile()">
        💾 Сохранить
      </button>

      <br><br>

      <button onclick="logout()">
        🚪 Выйти
      </button>

    </div>

  </section>


  <section id="publish" class="section hidden">

    <h2>➕ Новое объявление</h2>

    <label>
      Название
    </label>

    <input
      id="title"
      placeholder="Например: Учебник по математике"
    >

    <label>
      Описание
    </label>

    <textarea
      id="description"
      placeholder="Расскажи о товаре..."
    ></textarea>

    <label>
      Категория
    </label>

    <select id="type">

      <option value="">
        Выбери категорию
      </option>

      <option value="Учебники">
        📚 Учебники
      </option>

      <option value="Канцелярия">
        ✏️ Канцелярия
      </option>

      <option value="Одежда">
        👕 Одежда
      </option>

      <option value="Игры">
        🎮 Игры
      </option>

      <option value="Электроника">
        🎧 Электроника
      </option>

      <option value="Другое">
        📦 Другое
      </option>

    </select>

    <label>
      Цена
    </label>

    <select
      id="priceType"
      onchange="togglePrice()"
    >

      <option value="fixed">
        Фиксированная
      </option>

      <option value="range">
        Диапазон
      </option>

      <option value="free">
        Бесплатно
      </option>

    </select>

    <div id="fixedPrice">

      <label>
        Цена, ₽
      </label>

      <input
        id="priceFixed"
        type="number"
        min="0"
        placeholder="500"
      >

    </div>

    <div id="rangePrice" class="hidden">

      <label>
        От, ₽
      </label>

      <input
        id="priceFrom"
        type="number"
        min="0"
      >

      <label>
        До, ₽
      </label>

      <input
        id="priceTo"
        type="number"
        min="0"
      >

    </div>

    <label>
      Как связаться
    </label>

    <select id="contactType">

      <option value="Telegram">
        Telegram
      </option>

      <option value="Телефон">
        Телефон
      </option>

    </select>

    <input
      id="contact"
      placeholder="@username или телефон"
    >

    <label>
      Оплата
    </label>

    <input
      id="payment"
      placeholder="Например: наличными"
    >

    <button
      class="primary"
      onclick="addItem()"
    >
      🚀 Опубликовать
    </button>

  </section>

</main>


<div
  id="authModal"
  class="modal hidden"
>

  <div class="modal-box">

    <h2 id="authTitle">
      🔐 Войти
    </h2>

    <div id="registerNameBlock" class="hidden">

      <label>
        Ник
      </label>

      <input
        id="authName"
        type="text"
        placeholder="Придумай ник"
      >

    </div>

    <label>
      Ник
    </label>

    <input
      id="authNickname"
      type="text"
      placeholder="Твой ник"
    >

    <label>
      Пароль
    </label>

    <input
      id="authPassword"
      type="password"
      placeholder="Пароль"
    >

    <button
      id="authSubmit"
      class="primary"
      onclick="handleAuth()"
    >
      Войти
    </button>

    <div
      class="auth-link"
      id="authSwitch"
      onclick="toggleAuthMode()"
    >
      Нет аккаунта? Зарегистрироваться
    </div>

    <button
      class="close"
      onclick="closeAuth()"
    >
      Закрыть
    </button>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
