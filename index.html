<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Школьная Барахолка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">🎒 Школьная Барахолка</div>
  <button id="profileBtn">Войти</button>
</header>

<main>
  <section class="hero">
    <div>
      <div class="label">Твоя школьная площадка</div>
      <h1>Покупай. Продавай.<br>Обменивайся.</h1>
      <p>Учебники, игры, книги, поделки и безопасные услуги — всё в одном месте.</p>
      <button class="primary" id="sellBtn">＋ Разместить объявление</button>
    </div>
    <div class="heroIcon">🏫</div>
  </section>

  <section class="filters">
    <input id="search" placeholder="🔎  Найти товар или услугу">
    <select id="filter">
      <option value="all">Все категории</option>
      <option>Учёба</option>
      <option>Книги</option>
      <option>Игры</option>
      <option>Поделки</option>
      <option>Услуги</option>
      <option>Другое</option>
    </select>
  </section>

  <div class="heading">
    <h2>Объявления</h2><span id="count"></span>
  </div>
  <section id="ads" class="grid"></section>
</main>

<div id="modal" class="modal hidden">
  <div class="dialog">
    <button class="x" id="close">×</button>
    <h2 id="modalTitle">Регистрация</h2>

    <div id="authBox">
      <label>Никнейм
        <input id="nickname" maxlength="24" placeholder="Например, Max07">
      </label>
      <label>Класс
        <input id="className" maxlength="10" placeholder="Например, 7Б">
      </label>
      <button class="primary wide" id="login">Продолжить</button>
      <p class="hint">Не вводи настоящее имя, адрес, телефон или данные банковской карты.</p>
    </div>

    <div id="sellBox" class="hidden">
      <label>Название
        <input id="adTitle" maxlength="60" placeholder="Учебник по математике">
      </label>
      <label>Цена (€)
        <input id="adPrice" type="number" min="0" step="0.01" placeholder="5">
      </label>
      <label>Категория
        <select id="adCategory">
          <option>Учёба</option><option>Книги</option><option>Игры</option>
          <option>Поделки</option><option>Услуги</option><option>Другое</option>
        </select>
      </label>
      <label>Описание
        <textarea id="adDescription" maxlength="300" placeholder="Состояние, условия и т. п."></textarea>
      </label>
      <button class="primary wide" id="publish">Опубликовать</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
