<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Барахолка №52</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #202124;
    }

    header {
      background: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 12px #00000012;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    nav {
      display: flex;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 15px;
      font-size: 15px;
      cursor: pointer;
      background: #202124;
      color: white;
    }

    button:hover {
      opacity: .9;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px 15px 50px;
    }

    .hero {
      background: white;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px #0000000d;
    }

    .hero h2 {
      margin-top: 0;
      font-size: 27px;
    }

    .section {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px #0000000d;
    }

    .listing {
      border: 1px solid #e8e8e8;
      border-radius: 17px;
      padding: 17px;
      margin-top: 14px;
    }

    .listing h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      margin: 10px 0;
    }

    .type {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #f0f1f3;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .contact {
      margin-top: 12px;
      padding: 11px;
      border-radius: 12px;
      background: #f5f5f5;
    }

    .buy {
      width: 100%;
      margin-top: 14px;
      background: #16803c;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      margin: 6px 0 14px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }

    .hidden {
      display: none !important;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: #00000066;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 10px 40px #00000030;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .close {
      background: #eee;
      color: #222;
      width: 100%;
      margin-top: 8px;
    }

    .auth-link {
      margin-top: 15px;
      text-align: center;
      color: #555;
      cursor: pointer;
    }

    .profile-email {
      color: #777;
      margin-bottom: 15px;
    }

    @media (max-width: 650px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }

      nav {
        width: 100%;
      }

      nav button {
        flex: 1;
        font-size: 13px;
        padding: 10px 5px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🛍️ Барахолка №52</h1>

  <nav>
    <button onclick="showSection('home')">🏠 Главная</button>
    <button onclick="showProfile()">👤 Профиль</button>
    <button onclick="requestPublish()">➕ Разместить</button>
  </nav>
</header>


<main>

  <!-- ГЛАВНАЯ -->

  <section id="home" class="hero">
    <h2>Барахолка №52</h2>
    <p>
      Покупай, продавай и отдавай школьные вещи друг другу.
    </p>
  </section>

  <section id="announcements" class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <h2>📦 Объявления</h2>
      <button onclick="loadItems()">🔄</button>
    </div>

    <div id="output">
      Загружаем объявления...
    </div>
  </section>


  <!-- ПРОФИЛЬ -->

  <section id="profile" class="section hidden">

    <h2>👤 Профиль</h2>

    <div id="profileNotLogged">
      <p>
        Ты пока не вошёл в аккаунт.
      </p>

      <button onclick="openAuth('profile')">
        🔐 Войти / зарегистрироваться
      </button>
    </div>

    <div id="profileLogged" class="hidden">

      <p class="profile-email" id="profileEmail"></p>

      <label>Ник</label>

      <input id="profileName" type="text">

      <button onclick="saveProfile()">
        💾 Сохранить ник
      </button>

      <br><br>

      <button onclick="logout()">
        🚪 Выйти
      </button>

    </div>

  </section>


  <!-- РАЗМЕЩЕНИЕ -->

  <section id="publish" class="section hidden">

    <h2>➕ Разместить объявление</h2>

    <label>Название товара</label>

    <input
      id="title"
      placeholder="Например: Учебник по математике"
    >

    <label>Описание</label>

    <textarea
      id="description"
      placeholder="Расскажи о товаре"
    ></textarea>

    <label>Тип товара</label>

    <select id="type">
      <option value="">Выбери категорию</option>
      <option value="Учебники">📚 Учебники</option>
      <option value="Канцелярия">✏️ Канцелярия</option>
      <option value="Одежда">👕 Одежда</option>
      <option value="Игры">🎮 Игры</option>
      <option value="Электроника">📱 Электроника</option>
      <option value="Другое">📦 Другое</option>
    </select>

    <label>Цена</label>

    <select id="priceType" onchange="togglePrice()">
      <option value="fixed">Фиксированная</option>
      <option value="range">Диапазон</option>
      <option value="free">Бесплатно</option>
    </select>

    <div id="fixedPrice">
      <label>Цена, ₽</label>
      <input id="priceFixed" type="number" min="0">
    </div>

    <div id="rangePrice" class="hidden">

      <label>От, ₽</label>
      <input id="priceFrom" type="number" min="0">

      <label>До, ₽</label>
      <input id="priceTo" type="number" min="0">

    </div>

    <label>Способ связи</label>

    <select id="contactType">
      <option value="Telegram">Telegram</option>
      <option value="Телефон">Телефон</option>
    </select>

    <input
      id="contact"
      placeholder="@username или номер телефона"
    >

    <label>Оплата</label>

    <input
      id="payment"
      placeholder="Например: наличными"
    >

    <button
      onclick="addItem()"
      style="width:100%;margin-top:5px;"
    >
      🚀 Разместить объявление
    </button>

  </section>

</main>


<!-- ОКНО АВТОРИЗАЦИИ -->

<div id="authModal" class="modal hidden">

  <div class="modal-box">

    <h2 id="authTitle">
      🔐 Войти
    </h2>

    <div id="registerNameBlock" class="hidden">

      <label>Ник</label>

      <input
        id="authName"
        placeholder="Придумай ник"
      >

    </div>

    <label>Email</label>

    <input
      id="authEmail"
      type="email"
      placeholder="example@mail.ru"
    >

    <label>Пароль</label>

    <input
      id="authPassword"
      type="password"
      placeholder="Пароль"
    >

    <button
      id="authSubmit"
      onclick="handleAuth()"
      style="width:100%;"
    >
      Войти
    </button>

    <div
      class="auth-link"
      id="authSwitch"
      onclick="toggleAuthMode()"
    >
      Нет аккаунта? Зарегистрироваться
    </div>

    <button
      class="close"
      onclick="closeAuth()"
    >
      Закрыть
    </button>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
